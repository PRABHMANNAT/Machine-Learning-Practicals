{% extends "base.html" %}
{% block content %}
  <h1>{{ 'Edit' if task else 'Create' }} Task</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="card">
    <label for="title">Title</label>
    <input id="title" name="title" value="{{ task.title if task else '' }}" required maxlength="200">
    {% if task %}
      <label><input type="checkbox" name="done" {% if task.done %}checked{% endif %}> Done</label>
    {% endif %}
    <button type="submit">Save</button>
  </form>
{% endblock %}
