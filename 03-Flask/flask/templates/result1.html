{% extends "base.html" %}
{% block content %}
  <h1>Final Results</h1>
  <dl class="card">
    {% for key, value in results.items() %}
      {# Jinja comments do not appear in the browser's HTML. #}
      <dt>{{ key|replace('_', ' ')|title }}</dt>
      <dd>{{ value }}</dd>
    {% endfor %}
  </dl>
{% endblock %}
