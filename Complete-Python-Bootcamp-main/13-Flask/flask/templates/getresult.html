{% extends "base.html" %}
{% block content %}
  <h1>Score Calculator</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form action="{{ url_for('submit') }}" method="post" class="card">
    {% for field, label in [('science', 'Science'), ('maths', 'Maths'), ('c', 'C'), ('datascience', 'Data Science')] %}
      <label for="{{ field }}">{{ label }}</label>
      <input type="number" id="{{ field }}" name="{{ field }}" min="0" max="100" step="any" required>
    {% endfor %}
    <button type="submit">Calculate average</button>
  </form>
{% endblock %}
